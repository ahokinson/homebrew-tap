name: bump claude-code

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Run bump script
        id: bump
        run: |
          ./bin/bump-claude-code | tee bump.log
          if git diff --quiet -- Casks/claude-code.rb; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            version="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Casks/claude-code.rb)"
            echo "changed=true"        >>"$GITHUB_OUTPUT"
            echo "version=$version"    >>"$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: develop
          branch: bump/claude-code-${{ steps.bump.outputs.version }}
          commit-message: "claude-code ${{ steps.bump.outputs.version }}"
          title: "claude-code ${{ steps.bump.outputs.version }}"
          body-path: bump.log
          delete-branch: true
